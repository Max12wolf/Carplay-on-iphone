<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auto">
<title>Auto-Dashboard</title>
<meta name="theme-color" content="#050816">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#050816;--card:rgba(255,255,255,.14);--card2:rgba(255,255,255,.22);--text:#fff;--dim:#b4b7c6;--ok:#30d158;--focus:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg) radial-gradient(90% 70% at 70% 8%,#b3202e 0%,transparent 60%),radial-gradient(100% 80% at 100% 100%,#c2338f 0%,transparent 60%),radial-gradient(90% 80% at 0% 100%,#4b2a9a 0%,transparent 65%);background-attachment:fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;display:flex;padding:14px;user-select:none}
a{color:inherit;text-decoration:none}
.app{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
aside{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#clock{font-size:clamp(40px,8vw,60px);font-weight:700;line-height:1;letter-spacing:-.03em}
#date{color:var(--dim);font-size:clamp(14px,2.4vw,18px);margin-top:4px}
.sp{text-align:right}
#speed{font-size:clamp(40px,8vw,60px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
#unit{color:var(--dim);font-size:15px}
.st{color:var(--dim);font-size:13px;margin-top:4px}
.st.on{color:var(--ok)}.st.warn{color:#ff9f0a}
button{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--text);border:0;border-radius:12px;padding:9px 14px;font:inherit;font-size:15px;min-height:48px;cursor:pointer}
#gear{margin-top:10px}

/* Alles auf einem Bildschirm, jede Kachel = 1 Tipp */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(0,1fr);gap:8px}
.t{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:20px;min-width:0;min-height:0;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.3)}
.t:active{filter:brightness(.78);transform:scale(.97)}
.t:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.ic{position:relative;flex:none;width:clamp(34px,10vh,56px);aspect-ratio:1;border-radius:23%;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.ic svg{width:56%;height:56%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic svg .f{fill:#fff;stroke:none}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.t b{font-size:clamp(14px,3vh,20px);line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t small{color:rgba(255,255,255,.75);font-size:clamp(11px,2.1vh,14px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t small:empty{display:none}
.m{flex-direction:column;justify-content:center;text-align:center;gap:4px}
.m .ic{background:var(--card2);border-radius:50%}
.m small{display:none}
.play{background:#fff;color:#111;justify-content:center}
.play .ic{background:#fa2d48}
.play small{color:#555}
.dim{background:rgba(255,255,255,.08);box-shadow:none;border:2px dashed rgba(255,255,255,.3)}
.dim .ic{background:rgba(255,255,255,.15)}

@media (orientation:landscape){
  .app{flex-direction:row;gap:14px}
  aside{flex:none;width:clamp(120px,16vw,170px);flex-direction:column;align-items:flex-start;justify-content:space-between;margin:-14px 0 -14px -14px;padding:14px 14px 14px max(14px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.30);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .sp{text-align:left}
}
@media (orientation:portrait){
  .grid{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(104px,1fr);overflow:auto}
  .play{order:-1;grid-column:span 2!important}
}

/* Meldungsleiste */
#banner{display:none;position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;max-width:900px;margin:0 auto;align-items:center;gap:14px;padding:12px 16px;border-radius:22px;background:rgba(20,12,48,.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#banner.open{display:flex}
#banner i{width:48px;height:48px;border-radius:12px;background:#fa2d48;display:flex;align-items:center;justify-content:center;flex:none}
#banner svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
#banner svg .f{fill:#fff;stroke:none}
#banner div{flex:1;min-width:0}
#banner b{display:block;font-size:18px}
#banner small{color:var(--dim);font-size:14px}
#banner button{background:none;color:#4dd0ff;font-size:22px;font-weight:600;padding:0 8px}

/* Einstellungen */
.sheet{display:none;position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 28px);overflow:auto;max-width:560px;margin:0 auto;background:rgba(30,18,50,.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--card2);border-radius:20px;padding:14px;flex-direction:column;gap:10px;z-index:10;user-select:text}
.sheet.open{display:flex}
.sheet p{margin:6px 0 0;color:var(--dim);font-size:13px}
.sheet input{flex:1;background:var(--card2);color:var(--text);border:0;border-radius:10px;padding:11px;font:inherit;font-size:16px;min-width:0}
.sheet button{background:var(--card2);flex:none}
.frow{display:flex;gap:8px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div><div id="clock">--:--</div><div id="date"></div></div>
    <div class="sp">
      <div id="speed">0</div><div id="unit">km/h</div>
      <div class="st" id="gps">GPS: nicht aktiv</div>
      <div class="st" id="awake">Display: wird geprüft</div>
      <button id="gear">Einstellungen</button>
    </div>
  </aside>
  <nav class="grid" id="grid"></nav>
</div>

<div id="banner" role="alert"><i><svg viewBox="0 0 24 24"><path d="M12 4v9"/><circle class="f" cx="12" cy="18.5" r="1.4"/></svg></i><div><b id="bT"></b><small id="bS"></small></div><button id="bOk">OK</button></div>
<div class="sheet" id="sheet"></div>

<script>
var NAVS=[
{n:"Apple Karten",img:"assets/img-5.png",u:"https://maps.apple.com/",d:function(q){return"https://maps.apple.com/?dirflg=d&daddr="+q}},
{n:"Google Maps",img:"assets/app-googlemaps.png",u:"https://www.google.com/maps",d:function(q){return"https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination="+q}},
{n:"Waze",img:"assets/app-waze.png",u:"https://waze.com/ul",d:function(q){return"https://waze.com/ul?navigate=yes&q="+q}}];
var IC={
prev:'<path d="M6 5v14"/><path class="f" d="M19 5L9 12l10 7z"/>',
next:'<path d="M18 5v14"/><path class="f" d="M5 5l10 7-10 7z"/>',
play:'<path class="f" d="M3 5l9 7-9 7z"/><path d="M16 5v14M21 5v14"/>',
home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',
work:'<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V5h6v3M3 13h18"/>',
navi:'<path class="f" d="M12 2l7 19-7-4-7 4z"/>',
blitz:'<path d="M12 3l10 18H2z"/><path d="M12 10v5"/><circle class="f" cx="12" cy="18" r="1"/>',
wa:'<path d="M4 5h16a1 1 0 011 1v10a1 1 0 01-1 1H10l-5 4v-4H4a1 1 0 01-1-1V6a1 1 0 011-1z"/>',
phone:'<path class="f" d="M6 3h3l2 5-2 1.5a11 11 0 005.5 5.5L16 13l5 2v3a2 2 0 01-2 2A16 16 0 014 5a2 2 0 012-2z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
pod:'<circle class="f" cx="12" cy="10" r="2.5"/><path d="M7.5 15a6 6 0 119 0"/><path d="M12 14v7"/>',
cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>',
spot:'<circle cx="12" cy="12" r="9"/><path d="M7 10c3-1 7-1 10 1M7.5 13c2.5-.8 5.5-.5 8 1M8 16c2-.5 4-.3 6 .7"/>',
note:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
mus:'<path d="M9 18V6l10-2v12"/><circle class="f" cx="7" cy="18" r="2.5"/><circle class="f" cx="17" cy="16" r="2.5"/>'};
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var $=function(id){return document.getElementById(id)};
var ni=load("nav",0)%NAVS.length;
var BL=load("blitz","shortcuts://run-shortcut?name=Blitzer");if(typeof BL!=="string")BL="";
var FAV=load("fav",[]);if(!Array.isArray(FAV))FAV=[];
var DST=load("dest",[{n:"Nach Hause",a:""},{n:"Arbeit",a:""}]);
if(!Array.isArray(DST)||DST.length<2)DST=[{n:"Nach Hause",a:""},{n:"Arbeit",a:""}];
function cleanNum(n){return String(n).replace(/[^\d+*#]/g,"")}

/* Musik: ein Tipp führt den Kurzbefehl aus und kehrt zurück */
function sc(name){
  var base="shortcuts://";
  if(/^https?:/.test(location.href))return base+"x-callback-url/run-shortcut?name="+encodeURIComponent(name)+"&x-success="+encodeURIComponent(location.href.split("#")[0]);
  return base+"run-shortcut?name="+encodeURIComponent(name);
}
function tile(o){
  var a=document.createElement("a");a.className="t "+(o.c||"");a.href=o.h||"#";
  if(o.blank){a.target="_blank";a.rel="noopener"}
  var ic=document.createElement("i");ic.className="ic";if(o.bg)ic.style.background=o.bg;
  ic.innerHTML='<svg viewBox="0 0 24 24">'+IC[o.i]+'</svg>';
  if(o.img){var im=new Image();im.alt="";im.onerror=function(){im.remove()};im.src=o.img;ic.appendChild(im)}
  var tx=document.createElement("span");tx.className="tx";
  var b=document.createElement("b");b.textContent=o.l;
  var sm=document.createElement("small");sm.textContent=o.s||"";
  tx.appendChild(b);tx.appendChild(sm);a.appendChild(ic);a.appendChild(tx);
  if(o.w)a.style.gridColumn="span "+o.w;
  if(o.f)a.addEventListener("click",function(e){e.preventDefault();o.f()});
  return a;
}
var GN="linear-gradient(160deg,#8be28b,#4dc3ff)",GG="linear-gradient(160deg,#6ee88a,#128a3a)",GO="linear-gradient(160deg,#ff9f0a,#e0342b)";
function render(){
  var g=$("grid"),N=NAVS[ni],t=[];g.innerHTML="";
  t.push({c:"m",i:"prev",l:"Zurück",h:sc("Musik Zurück")});
  t.push({c:"play",i:"play",l:"Start / Pause",s:"Musik",h:sc("Musik Start"),w:3});
  t.push({c:"m",i:"next",l:"Weiter",h:sc("Musik Weiter")});
  DST.forEach(function(d,i){
    var ic=i?"work":"home";
    if(d.a)t.push({i:ic,l:d.n,h:N.d(encodeURIComponent(d.a)),blank:1,bg:GN});
    else t.push({c:"dim",i:ic,l:d.n,s:"Adresse festlegen",f:openSet});
  });
  t.push({i:"navi",l:"Navigation",s:N.n,h:N.u,blank:1,bg:GN,img:N.img});
  if(BL)t.push({i:"blitz",l:"Blitzer",h:BL,bg:GO,img:"assets/img-4.png"});
  else t.push({c:"dim",i:"blitz",l:"Blitzer",s:"Link festlegen",f:openSet});
  t.push({i:"phone",l:"Kontakte",h:sc("Kontakte anrufen"),bg:GG,img:"assets/img-2.jpg"});
  for(var k=0;k<3;k++){
    if(FAV[k])t.push({i:"phone",l:FAV[k].n,h:"tel:"+cleanNum(FAV[k].t),bg:GG,img:"assets/img-2.jpg"});
    else t.push({c:"dim",i:"plus",l:"Favorit",s:"festlegen",f:openSet});
  }
  t.push({i:"wa",l:"WhatsApp",h:"whatsapp://",bg:"#25d366",img:"assets/img-3.jpg"});
  t.push({i:"wa",l:"Nachrichten",h:"sms:",bg:GG,img:"assets/app-nachrichten.png"});
  t.push({i:"spot",l:"Spotify",h:"spotify://",bg:"linear-gradient(160deg,#3fe07a,#16a34a)",img:"assets/app-spotify.png"});
  t.push({i:"pod",l:"Podcasts",h:"podcasts://",bg:"linear-gradient(160deg,#c77dff,#7b2fd6)",img:"assets/app-podcasts.png"});
  t.push({i:"cal",l:"Kalender",h:"calshow://",bg:"linear-gradient(160deg,#ff8a65,#e0342b)",img:"assets/app-kalender.png"});
  t.push({i:"note",l:"Notizen",h:"mobilenotes://",bg:"linear-gradient(160deg,#ffe066,#f5a623)",img:"assets/app-notizen.png"});
  t.push({i:"mus",l:"Apple Musik",s:"öffnen",h:"music://",bg:"#fa2d48",img:"assets/img-1.png"});
  t.forEach(function(o){g.appendChild(tile(o))});
}

/* Einstellungen */
function el(tag,txt){var e=document.createElement(tag);if(txt)e.textContent=txt;return e}
function inp(ph,v,mode){var i=el("input");i.placeholder=ph;i.value=v||"";if(mode)i.inputMode=mode;return i}
function row(a,b){var r=el("div");r.className="frow";r.appendChild(a);r.appendChild(b);return r}
function openSet(){
  var s=$("sheet");if(s.classList.contains("open")){return}
  s.innerHTML="";
  var sw=el("button");function lab(){sw.textContent="Navi-App: "+NAVS[ni].n+" (tippen zum Wechseln)"}
  lab();sw.onclick=function(){ni=(ni+1)%NAVS.length;save("nav",ni);lab()};s.appendChild(sw);
  s.appendChild(el("p","Ziele mit Ein-Tipp-Route (Name und Adresse):"));
  var dn=[],da=[];
  DST.forEach(function(d,i){dn[i]=inp("Name",d.n);dn[i].maxLength=16;da[i]=inp("Straße, Ort",d.a);s.appendChild(row(dn[i],da[i]))});
  s.appendChild(el("p","Favoriten zum Anrufen (bis zu 3):"));
  var fn=[],ft=[];
  for(var i=0;i<3;i++){var f=FAV[i]||{n:"",t:""};fn[i]=inp("Name",f.n);fn[i].maxLength=14;ft[i]=inp("Nummer",f.t,"tel");s.appendChild(row(fn[i],ft[i]))}
  s.appendChild(el("p","Blitzer-Link (Kurzbefehl oder Web-Adresse):"));
  var bi=inp("shortcuts://run-shortcut?name=Blitzer",BL,"url");s.appendChild(bi);
  var ok=el("button","Fertig");
  ok.onclick=function(){
    DST=DST.map(function(d,i){return{n:dn[i].value.trim()||d.n,a:da[i].value.trim()}});
    FAV=[];for(var i=0;i<3;i++){var n=fn[i].value.trim(),t=ft[i].value.trim();if(n&&cleanNum(t))FAV.push({n:n,t:t})}
    BL=bi.value.trim();
    save("dest",DST);save("fav",FAV);save("blitz",BL);
    s.classList.remove("open");render();
  };
  s.appendChild(ok);s.classList.add("open");
}
$("gear").onclick=openSet;
render();

/* Uhr */
function tick(){
  var d=new Date();
  $("clock").textContent=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  $("date").textContent=d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
}
tick();setInterval(tick,10000);

var bn=$("banner");
function banner(t,s){$("bT").textContent=t;$("bS").textContent=s;bn.classList.add("open")}
$("bOk").onclick=function(){bn.classList.remove("open")};

/* GPS / Tacho */
var gps=$("gps"),lastFix=0,lost=0;
setInterval(function(){if(lastFix&&Date.now()-lastFix>8000){$("speed").textContent="0";gps.textContent="GPS: kein Signal";gps.className="st warn";if(!lost){lost=1;banner("GPS-Signal verloren","Der Tacho steht auf 0, bis wieder ein Signal da ist.")}}},4000);
if("geolocation" in navigator){
  navigator.geolocation.watchPosition(function(p){
    var s=p.coords.speed;lastFix=Date.now();if(lost){lost=0;bn.classList.remove("open")}
    $("speed").textContent=(s==null||s<0.8)?"0":Math.round(s*3.6);
    gps.textContent="GPS: aktiv";gps.className="st on";
  },function(){gps.textContent="GPS: Zugriff erlauben";gps.className="st";banner("GPS ist aus","Erlaube den Standortzugriff in den iPhone-Einstellungen.")},{enableHighAccuracy:true,maximumAge:2000});
}else{gps.textContent="GPS nicht verfügbar"}

/* Display immer an */
var lock=null,aw=$("awake");
function awakeUi(on,msg){aw.textContent=msg;aw.className=on?"st on":"st"}
async function keepAwake(){
  if(!("wakeLock" in navigator)){awakeUi(false,"Display: Auto-Sperre auf Nie stellen");return}
  if(lock||document.visibilityState!=="visible")return;
  try{
    lock=await navigator.wakeLock.request("screen");
    awakeUi(true,"Display: bleibt an");
    lock.addEventListener("release",function(){lock=null;awakeUi(false,"Display: Tippen zum Aktivieren")});
  }catch(e){lock=null;awakeUi(false,"Display: Tippen zum Aktivieren")}
}
keepAwake();
document.addEventListener("visibilitychange",keepAwake);
["touchstart","click"].forEach(function(ev){document.addEventListener(ev,keepAwake,{passive:true})});
setInterval(keepAwake,15000);

/* Vollbild */
(function(){
  var standalone=(navigator.standalone===true)||matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches;
  function goFull(){
    if(document.fullscreenElement||standalone)return;
    var el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!f)return;
    try{var r=f.call(el);if(r&&r.then)r.then(function(){try{screen.orientation.lock("landscape").catch(function(){})}catch(e){}}).catch(function(){})}catch(e){}
  }
  document.addEventListener("click",goFull,{once:true});
  document.addEventListener("touchend",goFull,{once:true});
})();
if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
