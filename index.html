<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auto">
<title>Auto-Dashboard</title>
<meta name="theme-color" content="#050816">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#050816;--bgimg:radial-gradient(120% 80% at 12% 0%,#3a2fb8 0%,transparent 55%),radial-gradient(90% 70% at 100% 30%,#0a6ea8 0%,transparent 60%),radial-gradient(100% 80% at 30% 110%,#8a2be2 0%,transparent 55%);--card:rgba(255,255,255,.12);--card2:rgba(255,255,255,.2);--text:#fff;--dim:#b4b7c6;--ok:#30d158;--focus:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f2f7;--bgimg:none;--card:#fff;--card2:#e5e5ea;--text:#000;--dim:#5f6370;--ok:#1a8f3a;--focus:#000}}
:root[data-theme="dark"]{--bg:#050816;--bgimg:radial-gradient(120% 80% at 12% 0%,#3a2fb8 0%,transparent 55%),radial-gradient(90% 70% at 100% 30%,#0a6ea8 0%,transparent 60%),radial-gradient(100% 80% at 30% 110%,#8a2be2 0%,transparent 55%);--card:rgba(255,255,255,.12);--card2:rgba(255,255,255,.2);--text:#fff;--dim:#b4b7c6;--ok:#30d158;--focus:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{background:var(--bg);background-image:var(--bgimg);background-attachment:fixed;background-size:cover;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;display:flex;padding:14px;user-select:none}
a{color:inherit;text-decoration:none}
.app{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0;width:100%}
aside{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#clock{font-size:clamp(40px,8vw,64px);font-weight:700;line-height:1;letter-spacing:-.03em}
#date{color:var(--dim);font-size:clamp(14px,2.4vw,18px);margin-top:4px}
.sp{text-align:right}
#speed{font-size:clamp(40px,8vw,64px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
#unit{color:var(--dim);font-size:clamp(13px,2vw,16px)}
.st{color:var(--dim);font-size:13px;margin-top:4px}
.st.on{color:var(--ok)}
.main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:max-content;align-content:center;gap:clamp(16px,4vw,32px) clamp(8px,3vw,24px)}
.app-i{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:clamp(14px,2.6vw,19px);font-weight:500;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.app-i i{width:100%;max-width:128px;aspect-ratio:1;border-radius:23%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.app-i:active i{filter:brightness(.8);transform:scale(.96)}
.app-i:focus-visible,.cb:focus-visible,.home:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:16px}
.app-i svg{width:52%;height:52%;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-i svg .f{fill:#fff;stroke:none}
.app-i i.img{background:none;overflow:hidden}
.app-i i.img img{width:100%;height:100%;display:block;transform:scale(1.04)}
.app-i small{display:block;color:var(--dim);font-weight:400;font-size:.72em;margin-top:2px;text-shadow:none}
button{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--text);border:0;border-radius:12px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}
#gear{margin-top:10px}

/* Musik-Oberfläche */
#musicView{display:none;flex:1;min-width:0;min-height:0}
body.music #musicView{display:flex}
body.music .app{display:none}
.mv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);position:relative;text-align:center;min-height:0}
.home{position:absolute;top:0;left:0;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;padding:10px 16px;font-size:15px;font-weight:600}
.cover{width:min(56vw,34vh);aspect-ratio:1;border-radius:23%;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.cover img{width:100%;height:100%;display:block;transform:scale(1.04)}
.ctl h2{margin:0;font-size:clamp(24px,5vw,38px);letter-spacing:-.02em}
.ctl p{margin:6px 0 0;color:var(--dim);font-size:clamp(13px,2.4vw,17px)}
.btns{display:flex;gap:clamp(16px,5vw,40px);align-items:flex-start;justify-content:center;margin-top:clamp(12px,3vh,24px)}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.cb i{width:clamp(64px,15vw,92px);height:clamp(64px,15vw,92px);border-radius:50%;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center}
.cb:active i{background:var(--card2);transform:scale(.95)}
.cb.big i{background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.cb svg{width:42%;height:42%;stroke:var(--text);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cb svg .f{fill:var(--text);stroke:none}
.cb.big svg .f{fill:#fa2d48}
.openm{color:var(--dim);font-size:14px;display:inline-block;padding:8px;margin-top:6px}


/* Telefon-Oberfläche */
#phoneView{display:none;flex:1;min-width:0;min-height:0}
body.phone #phoneView{display:flex}
body.phone .app{display:none}
.pv{flex:1;display:flex;flex-direction:column;gap:16px;position:relative;padding-top:54px;min-height:0;overflow:auto}
.pv h2{margin:0;font-size:clamp(24px,5vw,34px);letter-spacing:-.02em}
.fav{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 12px}
.fv{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:clamp(13px,2.4vw,16px);font-weight:500;text-align:center;min-width:0;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.fv i{width:clamp(64px,16vw,84px);aspect-ratio:1;border-radius:50%;background:linear-gradient(160deg,#6ee88a,#30d158 55%,#128a3a);color:#fff;font-style:normal;font-weight:600;font-size:clamp(22px,5vw,30px);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.fv span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv:active i{filter:brightness(.8);transform:scale(.95)}
.fv:focus-visible,.pbtn:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:16px}
.prow{display:flex;gap:10px;flex-wrap:wrap}
.pbtn{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;padding:12px 18px;font-size:16px;font-weight:600}
.emp{color:var(--dim);margin:0}
.fedit{display:none;flex-direction:column;gap:8px;background:var(--card);border-radius:16px;padding:12px}
.fedit.open{display:flex}
.fedit p{margin:0;color:var(--dim);font-size:13px}
.frow{display:flex;gap:8px}
.frow input{flex:1;min-width:0;background:var(--card2);color:var(--text);border:0;border-radius:10px;padding:10px;font:inherit;font-size:15px}
.fedit button{background:var(--card2)}

/* Einstellungen */
.sheet{display:none;position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--card);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--card2);border-radius:20px;padding:14px;flex-direction:column;gap:10px;z-index:10}
.sheet.open{display:flex}
.sheet p{margin:0;color:var(--dim);font-size:13px}
.sheet input{background:var(--card2);color:var(--text);border:0;border-radius:10px;padding:10px;font:inherit;font-size:15px;min-width:0}
.sheet button{background:var(--card2)}

@media (orientation:landscape){
  .app{flex-direction:row;gap:clamp(16px,4vw,40px)}
  aside{flex:none;width:clamp(130px,22vw,220px);flex-direction:column;align-items:flex-start;justify-content:space-between;padding:6px 0}
  .sp{text-align:left}
  .grid{grid-template-columns:repeat(5,1fr)}
  .app-i i{max-width:104px}
  .mv{flex-direction:row;gap:clamp(24px,6vw,64px)}
  .cover{width:min(44vh,34vw)}
  .ctl{text-align:left}
  .btns{justify-content:flex-start}
}

/* Bedienung im Auto: größere Ziele */
.home{min-height:52px;display:flex;align-items:center;font-size:17px}
.cb{font-size:15px}
.openm{font-size:16px;padding:14px}
button{min-height:44px;font-size:15px}
#gear{min-height:48px}
.st.warn{color:#ff9f0a}

/* CarPlay-Look */
:root,:root[data-theme="dark"]{--bgimg:radial-gradient(90% 70% at 70% 8%,#b3202e 0%,transparent 60%),radial-gradient(100% 80% at 100% 100%,#c2338f 0%,transparent 60%),radial-gradient(90% 80% at 0% 100%,#4b2a9a 0%,transparent 65%)}
.app-i span{background:rgba(40,12,20,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:4px 12px;border-radius:10px;color:#fff;text-shadow:none}
@media (orientation:landscape){
  aside{margin:-14px 0 -14px -14px;padding:14px 14px 14px max(14px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.30);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);width:clamp(140px,19vw,200px)}
}
/* Meldungsleiste */
#banner{display:none;position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;max-width:900px;margin:0 auto;align-items:center;gap:14px;padding:12px 16px;border-radius:22px;background:rgba(20,12,48,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#banner.open{display:flex}
#banner i{width:48px;height:48px;border-radius:12px;background:#fa2d48;display:flex;align-items:center;justify-content:center;flex:none}
#banner svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
#banner svg .f{fill:#fff;stroke:none}
#banner div{flex:1;min-width:0}
#banner b{display:block;font-size:18px}
#banner small{color:#b4b7c6;font-size:14px}
#banner button{background:none;color:#4dd0ff;font-size:22px;font-weight:600;min-height:48px;padding:0 8px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div><div id="clock">--:--</div><div id="date"></div></div>
    <div class="sp">
      <div id="speed">0</div><div id="unit">km/h</div>
      <div class="st" id="gps">GPS: nicht aktiv</div>
      <div class="st" id="awake">Display: wird geprüft</div>
      <button id="gear">Einstellungen</button>
    </div>
  </aside>

  <section class="main">
    <nav class="grid">
      <a class="app-i" id="tileMusic" href="#musik"><i class="img"><img alt="" src="assets/img-1.png"></i><span>Musik</span></a>
      <a class="app-i" id="navi" href="#" target="_blank" rel="noopener"><i id="naviIcon" style="background:linear-gradient(160deg,#8be28b,#4dc3ff)"><svg viewBox="0 0 24 24"><path class="f" d="M12 2l7 19-7-4-7 4z"/></svg><img id="naviImg" alt="" style="display:none"></i><span>Navigation<small id="naviName"></small></span></a>
      <a class="app-i" id="tilePhone" href="#telefon"><i class="img"><img alt="" src="assets/img-2.jpg"></i><span>Telefon</span></a>
      <a class="app-i" href="whatsapp://"><i class="img"><img alt="" src="assets/img-3.jpg"></i><span>WhatsApp</span></a>
      <a class="app-i" id="blitz" href="#"><i class="img"><img alt="" src="assets/img-4.png"></i><span>Blitzer</span></a>
    </nav>
  </section>
</div>

<section id="musicView">
  <div class="mv">
    <a class="home" id="homeBtn" href="#">Home</a>
    <div class="cover"><img id="mvCover" alt=""></div>
    <div class="ctl">
      <h2>Apple Musik</h2>
      <p>Steuert die Musik im Hintergrund</p>
      <div class="btns">
        <a class="cb" id="bPrev" href="#"><i><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path class="f" d="M19 5L9 12l10 7z"/></svg></i>Zurück</a>
        <a class="cb big" id="bPlay" href="#"><i><svg viewBox="0 0 24 24"><path class="f" d="M7 4l13 8-13 8z"/></svg></i>Start/Pause</a>
        <a class="cb" id="bNext" href="#"><i><svg viewBox="0 0 24 24"><path d="M18 5v14"/><path class="f" d="M5 5l10 7-10 7z"/></svg></i>Weiter</a>
      </div>
      <a class="openm" href="music://">Apple Musik öffnen</a>
    </div>
  </div>
</section>

<section id="phoneView">
  <div class="pv">
    <a class="home" id="homeBtn2" href="#">Home</a>
    <h2>Telefon</h2>
    <div class="fav" id="favs"></div>
    <div class="prow">
      <a class="pbtn" id="pContacts" href="#">Kontakte</a>
      <a class="pbtn" href="tel:">Tastatur</a>
      <button id="favEdit">Favoriten bearbeiten</button>
    </div>
    <div class="fedit" id="fedit"></div>
  </div>
</section>

<div id="banner" role="alert"><i><svg viewBox="0 0 24 24"><path d="M12 4v9"/><circle class="f" cx="12" cy="18.5" r="1.4"/></svg></i><div><b id="bT"></b><small id="bS"></small></div><button id="bOk">OK</button></div>

<div class="sheet" id="sheet">
  <button id="navSwitch">Navi-App: <span id="navLabel"></span> (tippen zum Wechseln)</button>
  <p>Blitzer-Link (Kurzbefehl oder Web-Adresse):</p>
  <input id="blInput" inputmode="url" placeholder="shortcuts://run-shortcut?name=Blitzer">
  <button id="sheetClose">Fertig</button>
</div>

<script>
var NAVS=[
{n:"Apple Karten",u:"https://maps.apple.com/",img:"assets/img-5.png",bg:"linear-gradient(160deg,#8be28b,#4dc3ff)",ic:'<path class="f" d="M12 2l7 19-7-4-7 4z"/>'},
{n:"Google Maps",u:"https://www.google.com/maps",bg:"linear-gradient(160deg,#ffffff,#dfe8f6)",ic:'<path style="fill:#ea4335;stroke:none" d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7z"/><circle style="fill:#fff;stroke:none" cx="12" cy="9" r="2.6"/>'},
{n:"Waze",u:"https://waze.com/ul",bg:"linear-gradient(160deg,#6fdcff,#33ccff)",ic:'<path class="f" d="M12 4c-4.4 0-8 3-8 7 0 2 1 3.5 2 4.5L5.5 19 9 17.5c1 .3 2 .5 3 .5 4.4 0 8-3 8-7s-3.6-7-8-7z"/><circle style="fill:#33ccff;stroke:none" cx="9.5" cy="10" r="1.2"/><circle style="fill:#33ccff;stroke:none" cx="14.5" cy="10" r="1.2"/>'}];
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var ni=load("nav",0)%NAVS.length;
var BL=load("blitz","shortcuts://run-shortcut?name=Blitzer");if(typeof BL!=="string")BL="";
var $=function(id){return document.getElementById(id)};

function render(){
  $("navi").href=NAVS[ni].u;
  $("naviName").textContent=NAVS[ni].n;
  $("navLabel").textContent=NAVS[ni].n;
  var nic=$("naviIcon"),nsv=nic.querySelector("svg"),nim=$("naviImg");
  if(NAVS[ni].img){nim.src=NAVS[ni].img;nim.style.display="block";nsv.style.display="none";nic.className="img";nic.style.background="none"}
  else{nim.style.display="none";nsv.style.display="";nic.className="";nic.style.background=NAVS[ni].bg;nsv.innerHTML=NAVS[ni].ic}
  $("blitz").href=BL||"#";
}
render();

/* Einstellungen */
var sheet=$("sheet"),bi=$("blInput");
$("gear").onclick=function(){bi.value=BL;sheet.classList.toggle("open")};
$("navSwitch").onclick=function(){ni=(ni+1)%NAVS.length;save("nav",ni);render()};
$("sheetClose").onclick=function(){BL=bi.value.trim();save("blitz",BL);sheet.classList.remove("open");render()};

/* Musik-Oberfläche: Steuerung über Kurzbefehle */
$("mvCover").src=document.querySelector("#tileMusic img").src;
function sc(name,view){view=view||"musik";
  var base="shortcuts://";
  if(/^https?:/.test(location.href)){
    return base+"x-callback-url/run-shortcut?name="+encodeURIComponent(name)+"&x-success="+encodeURIComponent(location.href.split("#")[0]+"#"+view);
  }
  return base+"run-shortcut?name="+encodeURIComponent(name);
}
$("bPrev").href=sc("Musik Zurück");
$("bPlay").href=sc("Musik Start");
$("bNext").href=sc("Musik Weiter");
var cur=location.hash==="#musik"?"musik":location.hash==="#telefon"?"telefon":"";
function apply(){document.body.classList.toggle("music",cur==="musik");document.body.classList.toggle("phone",cur==="telefon")}
function go(v){cur=v;try{if(v){location.hash=v}else if(location.hash){history.replaceState(null,"",location.href.split("#")[0])}}catch(e){}apply()}
addEventListener("hashchange",function(){cur=location.hash==="#musik"?"musik":location.hash==="#telefon"?"telefon":"";apply()});
apply();
$("tileMusic").addEventListener("click",function(e){e.preventDefault();go("musik")});
$("tilePhone").addEventListener("click",function(e){e.preventDefault();go("telefon")});
$("homeBtn").addEventListener("click",function(e){e.preventDefault();go("")});
$("homeBtn2").addEventListener("click",function(e){e.preventDefault();go("")});

/* Telefon: Favoriten und Kontakte */
var FAV=load("fav",[]);if(!Array.isArray(FAV))FAV=[];
function initials(n){var p=n.trim().split(/\s+/);return ((p[0]||"").charAt(0)+(p.length>1?p[p.length-1].charAt(0):"")).toUpperCase()}
function cleanNum(n){return String(n).replace(/[^\d+*#]/g,"")}
function renderFav(){
  var box=$("favs");box.innerHTML="";
  if(!FAV.length){var e=document.createElement("p");e.className="emp";e.textContent="Noch keine Favoriten. Tippt auf Favoriten bearbeiten.";box.appendChild(e)}
  FAV.forEach(function(f){
    var a=document.createElement("a");a.className="fv";a.href="tel:"+cleanNum(f.t);
    var c=document.createElement("i");c.textContent=initials(f.n);
    var s=document.createElement("span");s.textContent=f.n;
    a.appendChild(c);a.appendChild(s);box.appendChild(a);
  });
}
var fed=$("fedit");
function buildEdit(){
  fed.innerHTML="";
  var h=document.createElement("p");h.textContent="Bis zu 8 Favoriten. Sie werden nur auf diesem Gerät gespeichert.";fed.appendChild(h);
  for(var i=0;i<8;i++){
    var f=FAV[i]||{n:"",t:""};
    var r=document.createElement("div");r.className="frow";
    var n=document.createElement("input");n.placeholder="Name";n.maxLength=20;n.value=f.n;
    var t=document.createElement("input");t.placeholder="Nummer";t.inputMode="tel";t.value=f.t;
    r.appendChild(n);r.appendChild(t);fed.appendChild(r);
  }
  var b=document.createElement("button");b.textContent="Fertig";
  b.onclick=function(){
    var out=[];
    fed.querySelectorAll(".frow").forEach(function(r){var i=r.querySelectorAll("input"),n=i[0].value.trim(),t=i[1].value.trim();if(n&&cleanNum(t))out.push({n:n,t:t})});
    FAV=out;save("fav",FAV);fed.classList.remove("open");renderFav();
  };
  fed.appendChild(b);
}
$("favEdit").onclick=function(){if(fed.classList.contains("open")){fed.classList.remove("open")}else{buildEdit();fed.classList.add("open")}};
renderFav();
$("pContacts").href=sc("Kontakte anrufen","telefon");

/* Uhr */
function tick(){
  var d=new Date();
  $("clock").textContent=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  $("date").textContent=d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
}
tick();setInterval(tick,10000);

var bn=$("banner");
function banner(t,s){$("bT").textContent=t;$("bS").textContent=s;bn.classList.add("open")}
$("bOk").onclick=function(){bn.classList.remove("open")};

/* GPS / Tacho */
var gps=$("gps"),lastFix=0,lost=0;
setInterval(function(){if(lastFix&&Date.now()-lastFix>8000){$("speed").textContent="0";gps.textContent="GPS: kein Signal";gps.className="st warn";if(!lost){lost=1;banner("GPS-Signal verloren","Der Tacho steht auf 0, bis wieder ein Signal da ist.")}}},4000);
if("geolocation" in navigator){
  navigator.geolocation.watchPosition(function(p){
    var s=p.coords.speed;lastFix=Date.now();if(lost){lost=0;bn.classList.remove("open")}
    $("speed").textContent=(s==null||s<0.8)?"0":Math.round(s*3.6);
    gps.textContent="GPS: aktiv";gps.className="st on";
  },function(){gps.textContent="GPS: Zugriff erlauben";gps.className="st";banner("GPS ist aus","Erlaube den Standortzugriff in den iPhone-Einstellungen.")},{enableHighAccuracy:true,maximumAge:2000});
}else{gps.textContent="GPS nicht verfügbar"}

/* Display immer an */
var lock=null,aw=$("awake");
function awakeUi(on,msg){aw.textContent=msg;aw.className=on?"st on":"st"}
async function keepAwake(){
  if(!("wakeLock" in navigator)){awakeUi(false,"Display: Auto-Sperre auf Nie stellen");return}
  if(lock||document.visibilityState!=="visible")return;
  try{
    lock=await navigator.wakeLock.request("screen");
    awakeUi(true,"Display: bleibt an");
    lock.addEventListener("release",function(){lock=null;awakeUi(false,"Display: Tippen zum Aktivieren")});
  }catch(e){lock=null;awakeUi(false,"Display: Tippen zum Aktivieren")}
}
keepAwake();
document.addEventListener("visibilitychange",keepAwake);
["touchstart","click"].forEach(function(ev){document.addEventListener(ev,keepAwake,{passive:true})});
setInterval(keepAwake,15000);

/* Vollbild und App-Symbol */
(function(){
  var standalone=(navigator.standalone===true)||matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches;
  function goFull(){
    if(document.fullscreenElement||standalone)return;
    var el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!f)return;
    try{var r=f.call(el);if(r&&r.then)r.then(function(){try{screen.orientation.lock("landscape").catch(function(){})}catch(e){}}).catch(function(){})}catch(e){}
  }
  document.addEventListener("click",goFull,{once:true});
  document.addEventListener("touchend",goFull,{once:true});
})();
if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
